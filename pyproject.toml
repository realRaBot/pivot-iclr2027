[project]
name = "pivot-anon"
version = "0.2.0"
description = "Anonymous artifact for a differentiable Jaeckel implied-volatility operator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.0",
  "pyarrow>=15",
  "torch>=2.6",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]

[dependency-groups]
dev = ["pytest>=8", "py-lets-be-rational>=1.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_vollib", "src/pivot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
